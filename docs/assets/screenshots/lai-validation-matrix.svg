<text x="28" y="538" fill="#e7edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">## Risk profiles</text>
<text x="28" y="562" fill="#e7edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">- docs_config: focused inspection -&gt; make check</text>
<text x="28" y="586" fill="#e7edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">- runtime_code: focused regression -&gt; make check -&gt; make lint &amp;&amp; make test</text>
<text x="28" y="610" fill="#e7edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">- control_plane_security: focused boundary tests -&gt; make check -&gt; test_control_plane -&gt; make lint &amp;&amp; make test</text>
<text x="28" y="634" fill="#e7edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">- distribution_release: focused install/package smoke -&gt; make check -&gt; make lint &amp;&amp; make test -&gt; make test-dev -&gt; make milestone-gate</text>
<text x="28" y="658" fill="#e7edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">- milestone_freeze: make milestone-gate</text>
