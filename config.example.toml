[lai]
# Run `lai config` after editing this file. Unknown keys or invalid types fail closed.
# CLI flags override LAI_* environment variables, which override this file.
host = "127.0.0.1"
port = 8080
model = "mistralai/Ministral-3-8B-Instruct-2512-GGUF:Q4_K_M"
api_key_file = "~/.config/lai/llama-api-key"
data_dir = "~/.local/share/lai"
skills_dir = "~/.local/share/lai/skills"
state_dir = "~/.local/share/lai/state"
metrics_dir = "~/.local/share/lai/metrics"
audit_dir = "~/.local/share/lai/audit"

# Used only when local-agent needs to invoke a configured server launcher.
llama_server = "C:/path/to/llama-server.exe"
server_launcher = "lai-server-start"
chat_template = "C:/path/to/an-authorized-chat-template.jinja"
