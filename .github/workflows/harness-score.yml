name: Harness maturity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    name: Harness Score L4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate harness maturity
        uses: paladini/harness-score@3d1e34a35d011671d60b0935a662331c6ec3b324 # v1.6.5, harness-score 1.6.5 default
        with:
          min-level: "4"
          badge: ""
          report: ""
