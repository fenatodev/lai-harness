name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked development sensors
        run: python -m pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest -q

      - name: Ruff
        run: ruff check src tests .cursor/hooks

      - name: Mypy ratchet
        run: python -m mypy --config-file mypy.ini

      - name: Standard-library regression suite
        run: make test

      - name: Static checks
        run: make check

  publication:
    name: Publication gates
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked development sensors
        run: python -m pip install -r requirements.txt

      - name: Validate release artifacts
        run: make validate
